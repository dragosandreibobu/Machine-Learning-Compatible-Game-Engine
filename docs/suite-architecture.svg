<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Machine-Learning-Compatible Game Engine full-suite architecture</title>
  <desc id="desc">The suite combines a native C++ math, rendering and game layer, a set of example projects, and Python PyQt editor tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f1e7"/><stop offset="1" stop-color="#e4ece7"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24372f" flood-opacity=".13"/></filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#456657"/></marker>
  </defs>
  <rect width="1200" height="600" rx="30" fill="url(#bg)"/>
  <text x="60" y="70" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#203d33">ML-Compatible Game Engine — full suite</text>
  <text x="60" y="108" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52685f">Native graphics experiments, reusable engine primitives and Python editor tooling</text>
  <g filter="url(#s)">
    <rect x="65" y="170" width="300" height="285" rx="24" fill="#fffdf8" stroke="#cad5cc" stroke-width="2"/>
    <rect x="450" y="170" width="300" height="285" rx="24" fill="#fffdf8" stroke="#cad5cc" stroke-width="2"/>
    <rect x="835" y="170" width="300" height="285" rx="24" fill="#fffdf8" stroke="#cad5cc" stroke-width="2"/>
  </g>
  <text x="215" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#294b3f">C++ engine layer</text>
  <text x="215" y="265" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Vector3 and colour math</text>
  <text x="215" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">OpenGL primitives</text>
  <text x="215" y="335" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">GameObject components</text>
  <text x="215" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Input state</text>
  <text x="215" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">GLUT / GLEW / GLFW-era stack</text>
  <text x="600" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#294b3f">Example projects</text>
  <text x="600" y="265" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Julia and Fourier visualisations</text>
  <text x="600" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Pendulum simulations</text>
  <text x="600" y="335" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Pi experiments</text>
  <text x="600" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Tic-tac-toe and DVD bouncer</text>
  <text x="600" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Perlin-noise terrain</text>
  <text x="985" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#294b3f">Python editor layer</text>
  <text x="985" y="265" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">PyQt6 windows and tabs</text>
  <text x="985" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Project file management</text>
  <text x="985" y="335" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Hierarchy and inspector</text>
  <text x="985" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Scene and terminal tabs</text>
  <text x="985" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b62">Scientific / ML libraries</text>
  <line x1="365" y1="312" x2="440" y2="312" stroke="#456657" stroke-width="4" marker-end="url(#a)"/>
  <line x1="750" y1="312" x2="825" y2="312" stroke="#456657" stroke-width="4" marker-end="url(#a)"/>
  <rect x="260" y="510" width="680" height="54" rx="18" fill="#d8e6dc"/>
  <text x="600" y="544" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#294b3f">Historical prototype suite — components are partially integrated, not one packaged engine release</text>
</svg>
